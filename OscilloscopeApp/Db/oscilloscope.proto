OutTerminator = LF;
InTerminator = LF;
ReplyTimeout = 50000;
ReadTimeout = 2000; 
reset {
    out "*RST";
}

enableChannel1 {
    out "CHAN1:STAT ON";
}

enableChannel2 {
    out "CHAN2:STAT ON";
}

enableChannel3 {
    out "CHAN3:STAT ON";
}

enableChannel4 {
    out "CHAN4:STAT ON";
}

getWaveformData1 {
    separator=",";
    out "CHAN1:DATA?";
    in "%f";
}

getWaveformData2 {
    separator=",";
    out "CHAN2:DATA?";
    in "%f";
}

getWaveformData3 {
    separator=",";
    out "CHAN3:DATA?";
    in "%f";
}

getWaveformData4 {
    separator=",";
    out "CHAN4:DATA?";
    in "%f";
}

setMaxDataPoints {
    out "CHAN:DATA:POIN:DMAX";
}

setFormatASCII {
    out "FORM ASC";
}

setByteOrder {
    out "FORM:BORD LSBF";
}

singleAcquisition {
    out "SING;*OPC?";
}

getWaveformHeader {
    out "CHAN:DATA:HEAD?";
    in "%s";
}